<div class="form-container">
    <h2>{{ isEditMode ? 'Edit Payment' : 'Add New Payment' }}</h2>

    @if (loading) {
        <div>Loading...</div>
    }

    @if (!loading) {
        <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" formControlName="amount" min="0.01" step="0.01">
                @if (paymentForm.get('amount')?.invalid && paymentForm.get('amount')?.touched) {
                    <div style="color: red">
                        Amount must be greater than 0.
                    </div>
                }
            </div>

            <div class="form-group">
                <label for="currency">Currency</label>
                <select id="currency" formControlName="currency">
                    @for (curr of currencies; track curr) {
                        <option [value]="curr">{{ curr }}</option>
                    }
                </select>
            </div>

            <div class="actions">
                <button type="submit" [disabled]="paymentForm.invalid || submitting" class="btn btn-primary">
                    {{ submitting ? 'Saving...' : 'Save' }}
                </button>
                <button type="button" (click)="cancel()" class="btn btn-secondary">Cancel</button>
            </div>
        </form>
    }
</div>
